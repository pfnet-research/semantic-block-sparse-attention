# Model presets for the evaluation entry points (semblo.lm_eval_runner, semblo.cli).
# Qwen3.5-4B, Qwen3.5-35B-A3B and Nemotron 3.5 Lightning, dense and with the sparse attention of
# this repository, and Qwen3.5-2B dense. Beyond the native 262,144 positions the entry points override
# max_position_embeddings and the RoPE (see scripts/run_paper_cell.sh). limit_mm_per_prompt disables
# the vision tower, whose profiling pass crashes inside FlashAttention at long max_model_len. The
# evaluations are text-only.
models:
  qwen3_5_4b_dense_256k:

    hf_id: Qwen/Qwen3.5-4B
    backend: vllm
    model_family: qwen3_5
    max_model_len: 263168
    dtype: bfloat16
    trust_remote_code: true
    chat_template_kwargs:
      enable_thinking: false
    env:
      VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
      VLLM_ENABLE_V1_MULTIPROCESSING: "0"
      VLLM_DISABLE_COMPILE_CACHE: "1"
      TOKENIZERS_PARALLELISM: "false"
      PYTORCH_ALLOC_CONF: "expandable_segments:True"
    hf_overrides:
      text_config:
        max_position_embeddings: 263168
    vllm:
      tensor_parallel_size: 1
      gpu_memory_utilization: 0.75
      max_num_seqs: 1
      # Use 16K chunks for this long-context dense baseline. Unchunked prefill
      # produced incorrect outputs in the measurement environment.
      enable_chunked_prefill: true
      enable_prefix_caching: false
      max_num_batched_tokens: 16384
      limit_mm_per_prompt:
        image: 0
        video: 0
    generation:
      max_new_tokens: 2048
      temperature: 0.0
      top_p: 1.0
      seed: 0
    metadata:
      role: long-length dense baseline (256k)
      native_context_tokens: 262144

  qwen3_5_4b_dense_512k:

    hf_id: Qwen/Qwen3.5-4B
